<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>픽셀 아쿠아리움</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b2f;--paper:#fff7e6;--gold:#ffcf3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1e3a;font-family:'DotGothic16','Jua',sans-serif;color:var(--ink)}
canvas#tank{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.chip{background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);padding:4px 8px;font-size:16px;display:flex;gap:6px;align-items:center;pointer-events:auto}
.chip canvas{display:block}
.gbar{width:52px;height:10px;border:2px solid var(--ink);background:#fff}
.gbar i{display:block;height:100%;width:0;background:#4ad0c4}
.bar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.btn{font-family:inherit;font-size:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:9px 13px;border-radius:0;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ready{animation:blink .8s steps(2) infinite}
@keyframes blink{50%{background:#ff9cc2}}
.modal{position:fixed;inset:0;background:rgba(5,10,30,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.panel{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.45);width:min(420px,100%);max-height:86vh;overflow:auto;padding:14px}
.panel h2{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center;font-weight:normal}
.panel h2 small{font-size:14px;opacity:.7;margin-left:6px}
.x{font-family:inherit;background:none;border:3px solid var(--ink);width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ink);flex:none}
.zone{border:3px solid var(--ink);padding:10px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.zone .info{flex:1;min-width:0}
.zone b{font-size:17px;font-weight:normal}
.zone small{display:block;font-size:13px;opacity:.85;margin-top:3px;line-height:1.35}
.z-shallow{background:#c9f1ff}.z-coral{background:#ffdbe6}.z-deep{background:#cfcaf5}
.prog{height:16px;border:3px solid var(--ink);background:#fff;margin:10px 0}
.prog i{display:block;height:100%;background:#4ad0c4;transition:width .5s linear}
.center{text-align:center}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:3px solid var(--ink);background:#fff;padding:6px 4px 5px;text-align:center;font-size:13px;cursor:pointer;line-height:1.3}
.card .pic{height:52px;display:flex;align-items:center;justify-content:center}
.card.sel{background:#fff3c4}
.dexInfo{margin-top:12px;border:3px dashed var(--ink);padding:10px;font-size:14px;line-height:1.5;min-height:60px}
.r0{color:#6b7a8f}.r1{color:#2f7de1}.r2{color:#9b4de0}.r3{color:#e08a00}
.ach{border:3px solid var(--ink);padding:8px 10px;margin-bottom:8px;background:#fff;font-size:14px;line-height:1.4}
.ach.off{opacity:.55;background:#eee}
.ach b{font-weight:normal;font-size:16px}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.pop{position:fixed;font-size:15px;color:#fff;text-shadow:2px 2px 0 #1b1b2f;pointer-events:none;transform:translate(-50%,-100%);animation:up 1.1s forwards;z-index:4;white-space:nowrap}
.pop.gold{color:var(--gold)}
.pop.pink{color:#ffb3cc}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.reveal{text-align:center}
.stage{height:150px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);margin-bottom:10px}
.stage canvas{animation:bob 1.2s ease-in-out infinite}
.stage.shake canvas{animation:shake .15s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.st0{background:radial-gradient(#ffffff,#d9e2ec)}.st1{background:radial-gradient(#ffffff,#a9d0ff)}
.st2{background:radial-gradient(#ffffff,#d2a8ff)}.st3{background:radial-gradient(#fffbe0,#ffcf3a)}
.reveal h3{margin:6px 0;font-size:22px;font-weight:normal}
.new{background:#ff5a7a;color:#fff;font-size:13px;padding:2px 6px;vertical-align:middle}
.reveal p{font-size:14px;line-height:1.5;margin:6px 0 12px}
input.name{font-family:inherit;font-size:18px;border:3px solid var(--ink);padding:8px;width:100%;margin:6px 0 12px;background:#fff;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<canvas id="tank"></canvas>

<div class="hud">
  <div class="chip"><span id="coinIco"></span><span id="coinTxt">0</span></div>
  <div class="chip" id="gaugeChip"><span id="fishIco"></span><div class="gbar"><i id="gfill"></i></div><span id="tankTxt">0/20</span></div>
</div>

<div class="bar">
  <button class="btn primary" id="sumBtn">부르기 15</button>
  <button class="btn" id="dexBtn">도감</button>
  <button class="btn" id="achBtn">과제</button>
</div>

<div class="modal" id="dexModal"><div class="panel">
  <h2><span>물고기 도감<small id="dexCount"></small></span><button class="x" data-close>✕</button></h2>
  <div class="dex" id="dexGrid"></div>
  <div class="dexInfo" id="dexInfo">물고기를 눌러 보세요.</div>
</div></div>

<div class="modal" id="achModal"><div class="panel">
  <h2><span>도전 과제<small id="achCount"></small></span><button class="x" data-close>✕</button></h2>
  <div id="achList"></div>
</div></div>

<div class="modal" id="nameModal"><div class="panel">
  <h2>이름 짓기 <button class="x" data-close>✕</button></h2>
  <div id="nameWho" style="font-size:14px"></div>
  <input class="name" id="nameInput" maxlength="8" placeholder="최대 8글자">
  <div class="center"><button class="btn primary" id="nameOk">저장</button></div>
</div></div>

<div class="modal" id="revealModal"><div class="panel reveal" id="revealBody"></div></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   픽셀 아쿠아리움 — 가만히 보는 힐링 수족관
   ========================================================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const MAX_TANK=20;
const RAR=['일반','레어','에픽','전설'];
const CYCLE=960; // 게임 속 하루 = 16분

/* ---------------- 픽셀 스프라이트 ---------------- */
const BASE={o:'#2a1f3d',k:'#1a1a24',w:'#ffffff'};
const BODY={
 A:[".....ooooo....","...oobbbbboo..","oo.obbbbbbbbo.","ofoobbbbbbkbbo","offobbbbbbbbbo","ofoollllllllo.","oo..ollllllo..",".....oooooo..."],
 B:[".....ooooo....","...oobbbbboo..","...obbbbbbbbo.","oo.obbbbbbkbbo","ofoobbbbbbbbbo","offollllllllo.","oo..ollllllo..",".....oooooo..."]
};
const JELLY={
 A:["...oooooo...","..obbbbbbo..",".obbllbbbbo.",".obbbbbbbbo.","obbbkbbkbbbo","obbbbxxbbbbo","oooooooooooo",".x.x..x..x..",".x..x.x.x...","..x.x..x.x..",".x..x.x..x..","..x...x...x."],
 B:["...oooooo...","..obbbbbbo..",".obbllbbbbo.",".obbbbbbbbo.","obbbkbbkbbbo","obbbbxxbbbbo","oooooooooooo","..x.x..x..x.","..x..x.x.x..",".x..x.x..x..","..x.x..x.x..",".x...x...x.."]
};
const SLIME={
 A:["...oooo...","..obbbbo..",".oblbbbbo.",".obkbbkbo.","obbbbbbbbo","obbbbbbbbo",".oooooooo."],
 B:["..........","..oooooo..",".oblbbbbo.",".obkbbkbo.","obbbbbbbbo","obbbbbbbbo","oooooooooo"]
};
function build(base,marks,top){
  const make=rows=>{
    const g=rows.map(r=>r.split(''));
    for(const [x,y,ch] of (marks||[])) if(g[y]&&g[y][x]!==undefined) g[y][x]=ch;
    const out=g.map(r=>r.join(''));
    return top?top.concat(out):out;
  };
  return {A:make(base.A),B:make(base.B)};
}
function cols(cs,rows,ch='x'){
  const m=[];
  for(const c of cs) for(const y of rows){const a=BODY.A[y][c]; if(a==='b'||a==='l') m.push([c,y,ch]);}
  return m;
}
function checker(par,ch='x'){
  const m=[];
  for(let y=0;y<8;y++) for(let c=4;c<13;c++){const a=BODY.A[y][c]; if((a==='b'||a==='l')&&(y+c)%2===par) m.push([c,y,ch]);}
  return m;
}
const R04=[1,2,3,4],R06=[1,2,3,4,5,6];

/* ---------------- 물고기 목록 ----------------
   rar: 0 일반 1 레어 2 에픽 3 전설
   auto: 게이지로 저절로 오는 애들 / zones: 탐험에서 나오는 곳
   secret: 특별한 조건으로만 / hidden: 도감에 안 나오는 변신 형태 */

 {id:'gold',name:'꼬마 금붕어',rar:0,pal:{b:'#f2883a',l:'#ffd08a',f:'#e0553a'},desc:'제일 먼저 온 친구. 먹이 소리에 제일 먼저 달려와요.'},
 {id:'coin',name:'동전 물고기',rar:0,coinDrop:true,pal:{b:'#f5c542',l:'#fff1a6',f:'#e0a020',x:'#b87a0c'},
  marks:[[6,2,'x'],[7,2,'x'],[5,3,'x'],[8,3,'x'],[5,4,'x'],[8,4,'x'],[6,5,'x'],[7,5,'x']],desc:'가끔 동전을 퐁! 떨어뜨려요. 모래 위 동전을 눌러서 모으세요.'},
 {id:'stripe',name:'파랑 줄무늬',rar:0,pal:{b:'#4aa3e0',l:'#c4ecff',f:'#2e78c0',x:'#1d4f8a'},marks:cols([6,8],R06),desc:'줄무늬 개수는 본인도 잘 몰라요.'},
 {id:'red',name:'빨강이',rar:0,pal:{b:'#e8394a',l:'#ff9a9a',f:'#b8202e'},desc:'새빨간 물고기. 어디선가 거친 콧김이 느껴진대요.'},
 {id:'mint',name:'민트',rar:0,pal:{b:'#7fe0c0',l:'#dafff1',f:'#4fbf9f'},desc:'상쾌한 민트색. 호불호는 안 갈려요(아마도).'},
 {id:'dots',name:'점박이',rar:0,pal:{o:'#0f0f18',b:'#2a2a3a',l:'#45455a',f:'#1b1b28',x:'#ffffff'},
  marks:[[6,2,'x'],[9,2,'x'],[7,4,'x'],[11,4,'x'],[5,5,'x'],[9,5,'x'],[10,3,'w']],desc:'까만 몸에 하얀 점. 점을 세다 보면 잠이 와요.'},
 {id:'panda',name:'판다',rar:0,pal:{b:'#ffffff',l:'#ffffff',f:'#1a1a24',x:'#1a1a24'},
  marks:[[9,2,'x'],[10,2,'x'],[11,2,'x'],[9,3,'x'],[11,3,'x'],[9,4,'x'],[10,4,'x'],[11,4,'x'],[10,3,'w'],[6,1,'x'],[7,1,'x']],desc:'대나무는 못 먹지만 판다예요.'},
 {id:'melon',name:'수박',rar:0,pal:{b:'#4fb84f',l:'#ff6f7d',f:'#2d7a2d',x:'#2d7a2d'},
  marks:cols([5,7],R04).concat([[6,5,'k'],[9,5,'k'],[8,6,'k']]),desc:'여름 냄새가 나요. 씨는 뱉지 마세요.'},
 {id:'berry',name:'딸기',rar:0,top:["......g.g.....","......ggg....."],pal:{b:'#ff4d5e',l:'#ff8a95',f:'#d83040',y:'#ffe14a',g:'#3bb06a'},
  marks:[[5,2,'y'],[8,2,'y'],[11,2,'y'],[6,4,'y'],[9,4,'y'],[5,5,'y'],[8,5,'y']],desc:'머리에 꼭지가 달렸어요. 새콤달콤.'},
 {id:'check',name:'깅엄체크',rar:0,pal:{b:'#ffffff',l:'#ffe6ef',f:'#ff7aa8',x:'#ff9fc2'},marks:checker(0),desc:'피크닉 돗자리 무늬. 깔고 앉으면 안 돼요.'},
 {id:'tiger',name:'호랑이',rar:0,pal:{b:'#ff9a2e',l:'#ffe3b8',f:'#e07a10',x:'#2a1f1a'},
  marks:[[5,1,'x'],[5,2,'x'],[6,3,'x'],[7,1,'x'],[7,2,'x'],[8,3,'x'],[8,4,'x'],[11,2,'x']],desc:'어흥 하고 울고 싶지만 뻐끔밖에 못 해요.'},
 {id:'bubble',name:'방울이',rar:0,bubbles:true,pal:{b:'#8fe3d2',l:'#e0fff8',f:'#5cc2b0',x:'#ff9fb0'},marks:[[11,4,'x']],desc:'입에서 보글보글 방울을 만들어요.'},

 {id:'heart',name:'하트 물고기',rar:1,zones:['shallow','coral'],pal:{b:'#ff9cc2',l:'#ffe0ec',f:'#f06a9a',x:'#e8395a'},
  marks:[[5,2,'x'],[6,2,'x'],[8,2,'x'],[9,2,'x'],[5,3,'x'],[6,3,'x'],[7,3,'x'],[8,3,'x'],[9,3,'x'],[6,4,'x'],[7,4,'x'],[8,4,'x'],[7,5,'x']],desc:'몸에 하트가 있어요. 쓰다듬으면 하트가 두 배.'},
 {id:'clown',name:'광대 물고기',rar:1,zones:['coral'],pal:{b:'#ff7a1a',l:'#ffa45a',f:'#ff7a1a',x:'#ffffff',o:'#1a1a24'},marks:cols([5,9],R06),desc:'산호초의 인기 스타. 사진 찍히는 걸 좋아해요.'},
 {id:'jelly',name:'몽글 해파리',rar:1,zones:['coral','deep'],jelly:true,custom:JELLY,nightGlow:'#f6a9ff',
  pal:{o:'#8a3f9a',b:'#f6a9ff',l:'#ffffff',x:'#e08ae8',k:'#5a2a6a'},desc:'둥실둥실. 밤에는 은은하게 빛나요.'},
 {id:'piggy',name:'저금통 복어',rar:1,zones:['shallow','coral'],piggy:true,top:["......s..s...."],
  pal:{b:'#ffb3c7',l:'#ffe0ea',f:'#ff8fae',x:'#5a2a3a',s:'#ff7aa0',y:'#ffcf3a'},
  marks:[[6,1,'x'],[7,1,'x'],[8,1,'x'],[7,2,'y'],[12,4,'s'],[13,4,'s']],desc:'등에 동전 구멍이 있어요. 누르면 짤랑짤랑. 누군가 노리고 있대요.'},
 {id:'bull',name:'투우 물고기',rar:1,zones:['coral'],bull:true,top:[".........w.w..","........ww.ww."],
  pal:{o:'#0b0b10',b:'#2a2a33',l:'#4a4a55',f:'#1a1a22',w:'#f4efe0',r:'#ff3b3b',y:'#ffcf3a'},
  marks:[[10,3,'r'],[13,4,'y']],desc:'빨간색만 보면 참을 수가 없어요. 돌진!'},
 {id:'magN',name:'N극 물고기',rar:1,zones:['coral','deep'],magnet:'N',pal:{b:'#e8394a',l:'#ff8a8a',f:'#3a6fe0',x:'#ffffff'},
  marks:[[7,2,'x'],[6,3,'x'],[7,3,'x'],[8,3,'x'],[7,4,'x']],desc:'S극 물고기를 만나면 착 붙어요. 같은 N극끼리는 밀어내요.'},
 {id:'magS',name:'S극 물고기',rar:1,zones:['coral','deep'],magnet:'S',pal:{b:'#3a6fe0',l:'#8ab4ff',f:'#e8394a',x:'#ffffff'},
  marks:[[6,3,'x'],[7,3,'x'],[8,3,'x']],desc:'N극 물고기를 만나면 착 붙어요.'},
 {id:'slimeR',name:'빨강 젤리',rar:1,zones:['shallow','coral','deep'],slime:'R',custom:SLIME,pal:{o:'#5a2030',b:'#ff6b7a',l:'#ffffff'},desc:'말랑말랑. 다른 색 젤리와 부딪히면…?'},
 {id:'slimeY',name:'노랑 젤리',rar:1,zones:['shallow','coral','deep'],slime:'Y',custom:SLIME,pal:{o:'#6a5010',b:'#ffd84a',l:'#ffffff'},desc:'말랑말랑. 다른 색 젤리와 부딪히면…?'},
 {id:'slimeB',name:'파랑 젤리',rar:1,zones:['shallow','coral','deep'],slime:'B',custom:SLIME,pal:{o:'#1a3060',b:'#5aa9ff',l:'#ffffff'},desc:'말랑말랑. 다른 색 젤리와 부딪히면…?'},
 {id:'thief',name:'도둑 물고기',rar:1,zones:['shallow','coral','deep'],thief:true,pal:{b:'#7d8a99',l:'#d2d9e0',f:'#5c6775',m:'#1a1a24'},
  marks:[[8,2,'m'],[9,2,'m'],[10,2,'m'],[11,2,'m'],[8,3,'m'],[9,3,'m'],[10,3,'w'],[11,3,'m'],[12,3,'m']],
  desc:'마스크 쓴 좀도둑. 동전을 슬쩍해서 보물상자에 숨겨요. 물고 있을 때 누르면 "앗!"'},

 {id:'star',name:'별 물고기',rar:2,zones:['coral','deep'],sparkle:true,pal:{b:'#7c6cf0',l:'#cfc7ff',f:'#5a48d8',x:'#ffe14a'},
  marks:[[7,2,'x'],[5,3,'x'],[6,3,'x'],[7,3,'x'],[8,3,'x'],[9,3,'x'],[6,4,'x'],[7,4,'x'],[8,4,'x'],[6,5,'x'],[8,5,'x']],desc:'몸에 별이 박혀 있어요. 밤이 되면 별가루가 더 반짝여요.'},
 {id:'angler',name:'초롱 아귀',rar:2,zones:['deep'],glow:true,top:["............L.","...........o..","..........o..."],
  pal:{b:'#4a4870',l:'#6f6d9a',f:'#36345a',L:'#fff6a0'},marks:[[12,4,'w'],[11,5,'w'],[10,2,'w']],desc:'밤이 되면 초롱불이 환하게 켜져요. 생긴 것과 달리 겁쟁이.'},

  marks:[[8,2,'x'],[9,2,'x'],[10,2,'x'],[11,2,'x'],[8,3,'x'],[9,3,'s'],[10,3,'s'],[11,3,'x'],[8,4,'x'],[9,4,'x'],[10,4,'x'],[11,4,'x'],[5,4,'y'],[5,5,'y']],
  desc:'몸에 동전 투입구가 있어요. 누가 동전을 넣어 주면 띠리링♪'},
 {id:'disco',name:'디스코볼 물고기',rar:2,zones:['coral','deep'],disco:true,pal:{b:'#d4d9e2',l:'#eef1f6',f:'#9aa3b5',x:'#8a93a6'},marks:checker(1),desc:'밤이 되면 빙글빙글 오색 빛을 뿌려요.'},

function colorOf(sp,ch,c,t){
  if(sp.rainbow&&(ch==='b'||ch==='l'||ch==='f'))
    return `hsl(${Math.floor((t*90+c*24)%360)},85%,${ch==='l'?82:(ch==='f'?55:64)}%)`;
  return (sp.pal&&sp.pal[ch])||BASE[ch]||'#ff00ff';
}
function drawRows(g,sp,rows,x,y,flip,t,px=1){
  const w=rows[0].length;
  for(let r=0;r<rows.length;r++){const row=rows[r];
    for(let c=0;c<w;c++){const ch=row[c]; if(ch==='.')continue;
      g.fillStyle=colorOf(sp,ch,c,t);
      g.fillRect(flip?x+(w-1-c)*px:x+c*px,y+r*px,px,px);}}
}
function spriteCanvas(sp,sc,sil){
  const rows=sp.frames.A,w=rows[0].length,h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let r=0;r<h;r++)for(let x=0;x<w;x++){const ch=rows[r][x]; if(ch==='.')continue;
    g.fillStyle=sil?'#3a3a55':colorOf(sp,ch,x,0); g.fillRect(x,r,1,1);}
  const s=sc*Math.min(1.6,(sp.scale||1)); // 왕 젤리는 카드에서도 살짝 크게
  c.style.width=w*s+'px'; c.style.height=h*s+'px'; c.style.imageRendering='pixelated';
  return c;
}
function hexMix(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}

const SAVE_KEY='pixel-aquarium-v2';
function fresh(){return{coins:10,owned:{gold:1,coin:1},tank:[{id:'gold'},{id:'coin'}],stash:0,ach:{},
  nextAt:Date.now()+30000,nextLen:30,tips:{}};}
function load(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&Array.isArray(s.tank)) return Object.assign(fresh(),s);}catch(e){}
  return fresh();
}
const game=load();

function save(){

const cv=$('tank'),ctx=cv.getContext('2d');
let Z=3,W=130,H=280,SKY=12,SANDY=250,bg=null,weeds=[],stars=[];

function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function resize(){
  const iw=innerWidth,ih=innerHeight;
  Z=Math.max(2,Math.round(Math.min(iw,ih)/135));
  W=Math.ceil(iw/Z); H=Math.ceil(ih/Z);
  cv.width=W; cv.height=H; cv.style.width=W*Z+'px'; cv.style.height=H*Z+'px';
  SKY=Math.max(16,Math.round(H*0.095));
  SANDY=H-(Math.ceil(84/Z)+4);
  CHX=4; CHY=SANDY-5;
  buildBg(); buildWeeds();
  const R=seeded(11); stars=[];
  for(let i=0;i<Math.floor(W/6);i++) stars.push({x:Math.floor(R()*W),y:1+Math.floor(R()*(SKY-4)),p:R()*6});
  for(const f of fishes){f.x=clamp(f.x,0,W-f.w); if(!f.drop) f.y=clamp(f.y,SKY+3,SANDY-f.h-1);}
}
function buildBg(){
  bg=document.createElement('canvas'); bg.width=W; bg.height=H;
  const g=bg.getContext('2d'),R=seeded(7);
  const bands=['#6fd6ec','#56c3e3','#43aed8','#3596c8','#2c7db6','#2667a2','#21558c'];
  const span=SANDY-SKY,bh=span/bands.length;
  for(let y=SKY;y<SANDY+4;y++){
    const yy=y-SKY,i=Math.min(bands.length-1,Math.floor(yy/bh));
    g.fillStyle=bands[i]; g.fillRect(0,y,W,1);
    if(i<bands.length-1&&yy-i*bh>bh-3){g.fillStyle=bands[i+1]; for(let x=(y%2);x<W;x+=2) g.fillRect(x,y,1,1);}
  }
  for(let x=0;x<W;x++){
    const top=SANDY+Math.round(Math.sin(x*0.15)*1.2+Math.sin(x*0.05)*1.5);
    g.fillStyle='#f3dc9e'; g.fillRect(x,top,1,2);
    g.fillStyle='#e6c987'; g.fillRect(x,top+2,1,H-top);
  }
  for(let i=0;i<W*(H-SANDY)/14;i++){
    g.fillStyle=R()<.5?'#d3b06c':'#f6e4b2';
    g.fillRect(Math.floor(R()*W),SANDY+3+Math.floor(R()*(H-SANDY)),1,1);
  }
  for(let k=0;k<3;k++){
    const rx=Math.floor(W*0.35+R()*W*0.6),rw=5+Math.floor(R()*6),rh=3+Math.floor(R()*3);
    for(let dy=-rh;dy<=0;dy++)for(let dx=-rw;dx<=rw;dx++){
      if((dx*dx)/(rw*rw)+(dy*dy)/(rh*rh)>1)continue;
      g.fillStyle=dy<-rh+2?'#a9b3c2':(dx>rw/3?'#6e7788':'#8a94a6');
      g.fillRect(rx+dx,SANDY+1+dy,1,1);
    }
  }
  const sx=Math.floor(W*0.55+R()*W*0.3),sy=SANDY+6;
  g.fillStyle='#ff8a7a';
  [[0,-2],[0,-1],[-2,0],[-1,0],[0,0],[1,0],[2,0],[-1,1],[1,1],[-2,2],[2,2]].forEach(([a,b])=>g.fillRect(sx+a,sy+b,1,1));
  const cx=Math.floor(W*0.25+R()*W*0.2);
  g.fillStyle='#ffd1dc'; g.fillRect(cx-2,SANDY+9,5,2); g.fillRect(cx-1,SANDY+8,3,1);
  g.fillStyle='#e9a2b5'; g.fillRect(cx,SANDY+8,1,3);
}
function buildWeeds(){
  const R=seeded(3); weeds=[];
  const n=Math.max(5,Math.floor(W/22));
  for(let i=0;i<n;i++) weeds.push({x:Math.floor((i+0.3+R()*0.5)*W/n),h:Math.floor((SANDY-SKY)*(0.12+R()*0.18)),ph:R()*6,
    c1:R()<.5?'#3bb06a':'#4cc47a',c2:R()<.5?'#2e8f55':'#2a7d4a'});
}

/* ---------------- 낮과 밤 ---------------- */
function dayPhase(){return (Date.now()/1000+120)%CYCLE;} // 0~600 낮, 600~660 노을, 660~900 밤, 900~960 새벽
function darkness(){const p=dayPhase(); if(p<600)return 0; if(p<660)return (p-600)/60; if(p<900)return 1; return 1-(p-900)/60;}
const isNight=()=>darkness()>0.6;

/* ---------------- 물고기 ---------------- */
function makeFish(id,o={}){
  const f={id,name:o.name||'',vx:0,vy:0,tx:0,ty:0,dir:Math.random()<.5?1:-1,ph:Math.random()*10,wt:0,
    state:'wander',cool:6+Math.random()*8,carry:0,stT:0,dropT:10+Math.random()*10,bubT:2+Math.random()*3,spkT:1,
    stun:0,drop:!!o.drop,link:null,lead:false,spinT:0,playT:0,charge:null};
  setSpecies(f,id);
  f.x=o.x??rand(0,W-f.w);
  f.y=o.drop?SKY-f.h-2:(o.y??rand(SKY+6,SANDY-f.h-4));
  pickWander(f); return f;
}
function setSpecies(f,id){
  const sp=SP[id]; f.id=id; f.sp=sp; f.sc=sp.scale||1;
  f.w=sp.frames.A[0].length*f.sc; f.h=sp.frames.A.length*f.sc;
  f.spd=(sp.jelly||sp.slime?4:9)+Math.random()*5;
}
function pickWander(f){f.tx=rand(f.w/2+2,W-f.w/2-2); f.ty=rand(SKY+6+f.h/2,SANDY-f.h/2-3); f.wt=3+Math.random()*5;}
const center=f=>({x:f.x+f.w/2,y:f.y+f.h/2});
const alive=o=>fishes.includes(o)&&!o.drop&&!o.gone;

function thiefTarget(f,dt){
  const c=center(f);
  switch(f.state){
    case 'wander':{
      f.cool-=dt; if(f.cool>0) return null;
      let best=null,bd=1e9;
      for(const k of coins){if(k.dead)continue; const d=dist(k,c); if(d<bd){bd=d;best=k;}}
      if(best){f.state='chase';f.tgt=best;f.stT=14;return null;}
      const pig=fishes.filter(o=>o.sp.piggy&&alive(o)),cf=fishes.filter(o=>o.sp.coinDrop&&alive(o));
      const v=pig.length?pig:cf;
      if(v.length){f.state='sneak';f.vic=pick(v);f.stT=16;} else f.cool=10;
      return null;}
    case 'chase':{
      f.stT-=dt;
      if(f.tgt.dead||f.stT<0){f.state='wander';f.cool=5;return null;}
      const tx=f.tgt.x+2.5,ty=f.tgt.y+2.5;
      if(Math.abs(tx-c.x)<5&&Math.abs(ty-c.y)<f.h/2+3){
        f.tgt.dead=true; f.carry=f.tgt.v; f.state='carry'; f.stT=5+Math.random()*4;
        popText(c.x,f.y,'슬쩍!'); unlock('steal');
      }
      return {tx,ty,boost:1.9};}
    case 'sneak':{
      f.stT-=dt;
      if(!alive(f.vic)||f.stT<0){f.state='wander';f.cool=10;return null;}
      const v=center(f.vic);
      if(dist(v,c)<9){
        f.carry=5; f.state='carry'; f.stT=5+Math.random()*4;
        popText(c.x,f.y,'히히'); popText(v.x,f.vic.y,f.vic.sp.piggy?'짤랑!':'!?','pink'); unlock('steal');
      }
      return {tx:v.x,ty:v.y,boost:1.6};}
    case 'carry':{
      f.stT-=dt;
      if(f.stT<=0){const ar=fishes.find(o=>o.sp.arcade&&alive(o)&&o.playT<=0); f.state=ar?'arcade':'stash'; f.arc=ar;}
      return {wander:true,boost:1.5};}
    case 'arcade':{
      if(!alive(f.arc)||f.arc.playT>0){f.state='stash';return null;}
      const a=center(f.arc);
      if(dist(a,c)<9){
        f.arc.playT=2.6; f.arc.pay=true; f.carry=0; f.state='wander'; f.cool=18+Math.random()*12;
        popText(a.x,f.arc.y,'띠리링♪','gold');
      }
      return {tx:a.x,ty:a.y,boost:1.5};}
    case 'stash':{
      const tx=CHX+5,ty=CHY-f.h/2;
      if(Math.abs(tx-c.x)<5&&Math.abs(ty-c.y)<6){
        game.stash+=f.carry; f.carry=0; f.state='wander'; f.cool=20+Math.random()*15;
        popText(c.x,f.y,'쏙~'); save();
      }
      return {tx,ty,boost:1.5};}
  }
  return null;
}
function arcadePayout(a){
  const c=center(a),r=Math.random();
  if(r<0.3){popText(c.x,a.y,'꽝!','pink');return;}
  const n=r<0.88?2:5;
  for(let i=0;i<n;i++) setTimeout(()=>{if(alive(a)){const cc=center(a);spawnCoin(cc.x-2+rand(-3,3),cc.y);}},i*180);
  if(n===5){popText(c.x,a.y,'잭팟!!','gold'); unlock('jackpot');} else popText(c.x,a.y,'당첨!','gold');
}

function updateFish(f,dt,t){
  const sp=f.sp;
  if(f.held) return;
  if(f.gone){ f.y-=14*dt; f.alpha=Math.max(0,(f.alpha??1)-dt*0.4); return; }
  if(f.drop){
    f.y+=48*dt;
    if(f.y>SKY+1){f.drop=false; splash(f.x+f.w/2);}
    return;
  }
  if(f.stun>0){
    f.stun-=dt; const k=Math.pow(0.15,dt); f.vx*=k; f.vy*=k;
    f.x=clamp(f.x+f.vx*dt,0,W-f.w); f.y=clamp(f.y+f.vy*dt,SKY+3,SANDY-f.h-1);
    return;
  }
  // 자석: 붙어 있는 쪽(따라가는 쪽)
  if(f.link&&!f.lead){
    const L=f.link;
    if(!alive(L)){f.link=null;}
    else{
      const lc=center(L);
      if(f.spinT>0){f.spinT-=dt; const a=t*7; f.x=lc.x+Math.cos(a)*8-f.w/2; f.y=lc.y+Math.sin(a)*4-f.h/2;}
      else{f.dir=L.dir; f.x=L.dir>0?L.x-f.w+3:L.x+L.w-3; f.y=L.y+1;}
      f.x=clamp(f.x,0,W-f.w); f.y=clamp(f.y,SKY+3,SANDY-f.h-1);
      return;
    }
  }
  if(f.link&&f.lead&&!alive(f.link)){f.link=null;f.lead=false;}

  const c=center(f);
  let tgt=null,boost=1,busy=false;

  if(sp.thief){
    const r=thiefTarget(f,dt);
    if(r){boost=r.boost; busy=true; if(!r.wander) tgt={x:r.tx,y:r.ty};}
  }
  if(sp.bull){
    if(f.charge){
      const r=f.charge;
      if(!alive(r)){f.charge=null;}
      else{
        f.chT-=dt; const rc=center(r);
        if(dist(rc,c)<9){
          r.vx=(rc.x>=c.x?1:-1)*48; r.vy=-22; r.stun=1.3;
          f.vx*=-0.3; f.charge=null; f.cool=20+Math.random()*12;
          popText(rc.x,r.y,'쾅!'); unlock('bull');
        } else if(f.chT<0){f.charge=null; f.cool=12;}
        else {tgt=rc; boost=3.2; busy=true;}
      }
    } else {
      f.cool-=dt;
      if(f.cool<=0){
        let best=null,bd=75;
        for(const o of fishes) if(o.id==='red'&&alive(o)){const d=dist(center(o),c); if(d<bd){bd=d;best=o;}}
        if(best){f.charge=best; f.chT=5; popText(c.x,f.y,'!!','pink');} else f.cool=5;
      }
    }
  }
  if(sp.magnet){
    const opp=sp.magnet==='N'?'S':'N';
    if(!f.link){
      let best=null,bd=48;
      for(const o of fishes) if(o!==f&&o.sp.magnet===opp&&!o.link&&alive(o)){const d=dist(center(o),c); if(d<bd){bd=d;best=o;}}
      if(best){
        tgt=center(best); boost=1.4; busy=true;
        if(bd<10){
          const N=sp.magnet==='N'?f:best,S=N===f?best:f;
          N.link=S; S.link=N; N.lead=true; S.lead=false; S.spinT=2.2;
          popText(c.x,f.y,'착!'); unlock('magnet');
        }
      }
    }
    for(const o of fishes) if(o!==f&&o.sp.magnet===sp.magnet&&alive(o)){
      const oc=center(o),d=dist(oc,c)||1;
      if(d<16){f.vx+=(c.x-oc.x)/d*40*dt; f.vy+=(c.y-oc.y)/d*25*dt;}
    }
  }
  if(sp.slime){
    let best=null,bd=55;
    for(const o of fishes) if(o!==f&&o.sp.slime&&alive(o)&&![...o.sp.slime].some(ch=>sp.slime.includes(ch))){
      const d=dist(center(o),c); if(d<bd){bd=d;best=o;}
    }
    if(best){tgt=center(best); boost=1.3; busy=true; if(bd<8+f.w/4){mergeSlime(f,best); return;}}
  }
  if(!tgt&&!busy&&!sp.jelly&&!sp.slime&&pellets.length){
    let best=null,bd=1e9;
    for(const p of pellets){const d=dist(p,c); if(d<bd){bd=d;best=p;}}
    if(best){
      tgt=best; boost=2.2;
      if(Math.abs(best.x-c.x)<4&&Math.abs(best.y-c.y)<f.h/2+2){
        pellets.splice(pellets.indexOf(best),1);
        parts.push({k:'heart',x:c.x-2,y:f.y-4,life:1.2});
      }
    }
  }
  if(!tgt){
    f.wt-=dt;
    if(f.wt<=0||Math.hypot(f.tx-c.x,f.ty-c.y)<3) pickWander(f);
    tgt={x:f.tx,y:f.ty};
  }
  const dx=tgt.x-c.x,dy=tgt.y-c.y,d=Math.hypot(dx,dy)||1;
  let dvx=dx/d*f.spd*boost,dvy=dy/d*f.spd*boost*0.7;
  if(d<1.5){dvx=0;dvy=0;}
  const k=Math.min(1,dt*1.8);
  f.vx+=(dvx-f.vx)*k; f.vy+=(dvy-f.vy)*k;
  f.x=clamp(f.x+f.vx*dt,0,W-f.w); f.y=clamp(f.y+f.vy*dt,SKY+3,SANDY-f.h-1);
  if(f.vx>0.8)f.dir=1; else if(f.vx<-0.8)f.dir=-1;

  if(sp.coinDrop){f.dropT-=dt; if(f.dropT<=0){f.dropT=15+Math.random()*10;
    if(coins.filter(k=>!k.dead).length<12){spawnCoin(c.x-2,c.y); popText(c.x,f.y,'퐁!','gold');}}}
  if(sp.bubbles){f.bubT-=dt; if(f.bubT<=0){f.bubT=1.5+Math.random()*2.5;
    bubbles.push({x:f.dir>0?f.x+f.w:f.x-1,y:f.y+sp.topH+3,r:Math.random()<.5?1:2,vy:-rand(8,13),ph:Math.random()*6});}}
  if(sp.sparkle){f.spkT-=dt; if(f.spkT<=0){f.spkT=(isNight()?0.25:0.6)+Math.random()*0.8;
    parts.push({k:'spark',x:f.x+rand(2,f.w-2),y:f.y+rand(sp.topH,f.h),life:0.7});}}
  if(sp.arcade&&f.playT>0){f.playT-=dt; if(f.playT<=0&&f.pay){f.pay=false; arcadePayout(f);}}
}
function mergeSlime(a,b){
  const set=[...new Set((a.sp.slime+b.sp.slime).split(''))].sort((x,y)=>'RYB'.indexOf(x)-'RYB'.indexOf(y)).join('');
  const id='slime'+set; if(!SP[id]) return;
  fishes.splice(fishes.indexOf(b),1);
  const c=center(a); setSpecies(a,id);
  a.x=clamp(c.x-a.w/2,0,W-a.w); a.y=clamp(c.y-a.h/2,SKY+3,SANDY-a.h-1);
  popText(c.x,a.y,'뿅!');
  for(let i=0;i<6;i++) parts.push({k:'spark',x:c.x+rand(-6,6),y:c.y+rand(-5,5),life:0.8});
  game.owned[id]=(game.owned[id]||0)+1;
  if(set==='RYB'){unlock('slime'); toast('새 친구! 왕 젤리 ✨');}
  save();
}
function drawFish(f,t){
  const sp=f.sp,px=f.sc;
  const fr=(Math.floor(t*(sp.jelly||sp.slime?2:5)+f.ph)%2)?'B':'A';
  const x=Math.round(f.x),y=Math.round(f.y+(sp.jelly?Math.sin(t*2+f.ph)*1.5:0));
  const flip=!sp.jelly&&!sp.slime&&f.dir<0;
  if(f.gone) ctx.globalAlpha=f.alpha??1;
  else if(sp.slime) ctx.globalAlpha=0.9;
  drawRows(ctx,sp,sp.frames[fr],x,y,flip,t,px);
  ctx.globalAlpha=1;
  if(f.carry){
    const mx=flip?x-2:x+f.w-1,my=y+sp.topH+4;
    ctx.fillStyle='#ffcf3a'; ctx.fillRect(mx,my,3,3);
    ctx.fillStyle='#fff3a0'; ctx.fillRect(mx,my,1,1);
    ctx.fillStyle='#b87a0c'; ctx.fillRect(mx+2,my+2,1,1);
  }
}
function drawGlow(f,t,dk){
  const sp=f.sp,x=Math.round(f.x),y=Math.round(f.y+(sp.jelly?Math.sin(t*2+f.ph)*1.5:0)),flip=f.dir<0;
  if(sp.glow){
    const lx=x+(flip?f.w-1-12:12),ly=y;
    ctx.fillStyle='#fff6a0';
    ctx.globalAlpha=(0.1+0.35*dk)*(0.8+0.2*Math.sin(t*3)); ctx.fillRect(lx-4,ly-4,9,9);
    ctx.globalAlpha=0.2+0.4*dk; ctx.fillRect(lx-2,ly-2,5,5);
    ctx.globalAlpha=1; ctx.fillRect(lx,ly,1,1);
  }
  if(sp.nightGlow&&dk>0.3){
    ctx.fillStyle=sp.nightGlow; const gc=x+f.w/2,gy=y+4;
    for(const [rx,ry,a] of [[10,7,0.10],[7,5,0.14]]){ctx.globalAlpha=a*dk;
      for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(1-(dy*dy)/(ry*ry))); ctx.fillRect(gc-hw,gy+dy,hw*2,1);}}
  }
  if(sp.disco&&dk>0.3){
    const cx=x+f.w/2,cy=y+f.h/2;
    for(let i=0;i<8;i++){
      const a=t*1.5+i*Math.PI/4,r=11+4*Math.sin(t*2+i);
      ctx.globalAlpha=0.75*dk; ctx.fillStyle=`hsl(${(i*45+t*80)%360},90%,65%)`;
      ctx.fillRect(Math.round(cx+Math.cos(a)*r*1.5),Math.round(cy+Math.sin(a)*r*0.8),2,1);
    }
  }
  if(sp.arcade&&(f.playT>0||dk>0.5)){
    const rows=sp.frames.A,w=rows[0].length;
    ctx.globalAlpha=1;
    for(let r=0;r<rows.length;r++)for(let c=0;c<w;c++){
      const ch=rows[r][c]; if(ch!=='s'&&!(ch==='x'&&f.playT>0))continue;
      ctx.fillStyle=f.playT>0?`hsl(${(t*400+c*40+r*60)%360},90%,60%)`:'#6fffb0';
      ctx.fillRect(flip?x+w-1-c:x+c,y+r,1,1);
    }
  }
  ctx.globalAlpha=1;
}

function spawnCoin(x,y,v=5){coins.push({x,y,vy:14,restY:SANDY-3+Math.floor(Math.random()*3),v,dead:false});}
function feed(x,y){
  if(pellets.length>30)return;
  for(let i=0;i<3;i++) pellets.push({x:x+rand(-3,3),y:y+rand(-1,1),vy:rand(7,10),ph:Math.random()*6,life:10});

/* ---------------- 새 친구 도착 ---------------- */
const arriveLen=n=>Math.min(300,40+n*15);
function rollAuto(){
  const rar=Math.random()<0.72?0:1;
  return pick(SPECIES.filter(s=>s.auto&&s.rar===rar));
}
function addFish(id,opt={}){
  const f=makeFish(id,Object.assign({drop:true,x:rand(4,W-20)},opt));
  fishes.push(f);
  const isNew=!game.owned[id];
  game.owned[id]=(game.owned[id]||0)+1;
  checkCounts(); save();
  return {f,isNew};
}
function arrive(){
  const sp=rollAuto(),{f,isNew}=addFish(sp.id);
  setTimeout(()=>popText(f.x+f.w/2,SKY+2,isNew?'NEW!':'퐁당!',isNew?'gold':''),400);
  if(isNew) toast(`새 친구가 왔어요! ${sp.name} ✨`);
}
function tickArrival(){
  const now=Date.now();
  if(fishes.length>=MAX_TANK){game.nextAt=now+game.nextLen*1000; return;}
  if(now>=game.nextAt){
    arrive();
    game.nextLen=arriveLen(fishes.length);
    game.nextAt=now+game.nextLen*1000; save();
  }
}

/* ---------------- 배경 이벤트 ---------------- */
let evT=50+Math.random()*40,rainT=0;
function startEvent(){
  const night=isNight(),opts=[['boat',22],['ducks',18],['whale',20]];
  if(rainT<=0) opts.push(['rain',16]);
  if(night) opts.push(['meteor',22]);
  if(fishes.filter(f=>f.sp.rar===0&&alive(f)).length>=1&&fishes.length>=5&&!events.some(e=>e.k==='ufo')) opts.push(['ufo',5]);
  let tot=opts.reduce((a,o)=>a+o[1],0),r=Math.random()*tot,k='boat';
  for(const [n,w] of opts){if(r<w){k=n;break;} r-=w;}
  const dir=Math.random()<.5?1:-1;
  if(k==='boat') events.push({k,dir,x:dir>0?-22:W+2,spd:6});
  if(k==='ducks') events.push({k,dir,x:dir>0?-26:W+2,spd:5});
  if(k==='whale') events.push({k,dir,x:dir>0?-60:W+10,y:rand(SKY+20,SANDY-30),spd:5});
  if(k==='meteor'){events.push({k,x:rand(W*0.4,W),y:1,life:0.9}); unlock('star');}
  if(k==='rain'){rainT=60+Math.random()*30; unlock('rain'); toast('비가 내려요 ☔');}
  if(k==='ufo'){
    const tgt=pick(fishes.filter(f=>f.sp.rar===0&&alive(f)));
    events.push({k,tgt,x:center(tgt).x-5,y:-6,ph:'in',t:0});
  }
}
function updateEvents(dt){
  evT-=dt; if(evT<=0){evT=70+Math.random()*90; startEvent();}
  if(rainT>0){
    rainT-=dt;
    for(let i=0;i<Math.ceil(dt*40);i++) rain.push({x:rand(0,W),y:rand(-4,SKY-2)});
  }
  for(const r of rain) r.y+=110*dt;
  rain=rain.filter(r=>{if(r.y>SKY+5){return false;} if(r.y>SKY&&Math.random()<0.08) parts.push({k:'ripple',x:r.x,y:SKY,life:0.3}); return true;});
  for(const e of events){
    if(e.k==='boat'||e.k==='ducks'||e.k==='whale'){e.x+=e.dir*e.spd*dt; if(e.x<-80||e.x>W+80) e.done=true;}
    if(e.k==='meteor'){e.x-=70*dt; e.y+=18*dt; e.life-=dt; if(e.life<=0) e.done=true;}
    if(e.k==='ufo'){
      e.t+=dt;
      if(e.ph==='in'){e.y+=8*dt; if(e.y>=SKY-9){e.y=SKY-9; e.ph='beam'; e.t=0; toast('하늘에 뭔가가…! 🛸');}}
      else if(e.ph==='beam'){
        if(alive(e.tgt)){const f=e.tgt; f.stun=0.2; f.vx=0; f.vy=0; f.x+=((e.x+5-f.w/2)-f.x)*Math.min(1,dt*2); f.y-=18*dt;
          if(f.y<SKY+2){f.gone=true; f.alpha=1; setTimeout(()=>{const i=fishes.indexOf(f); if(i>=0)fishes.splice(i,1); save();},1500);}}
        if(e.t>4.5){e.ph='drop'; e.t=0; const {isNew}=addFish('alien',{x:e.x-2}); unlock('ufo'); if(isNew) toast('새 친구! 외계 물고기 ✨');}
      }
      else if(e.ph==='drop'){if(e.t>1.5) e.ph='out';}
      else {e.y-=14*dt; if(e.y<-10) e.done=true;}
    }
  }
  events=events.filter(e=>!e.done);
}
function drawWhales(){
  for(const e of events){if(e.k!=='whale')continue;
    ctx.fillStyle='#06203a'; ctx.globalAlpha=0.13;
    const cx=Math.round(e.x),cy=Math.round(e.y);
    for(let dy=-7;dy<=7;dy++){const hw=Math.round(24*Math.sqrt(1-(dy*dy)/49)); ctx.fillRect(cx-hw,cy+dy,hw*2,1);}
    const tx=e.dir>0?cx-26:cx+22;
    for(let i=0;i<6;i++) ctx.fillRect(e.dir>0?tx-i:tx+i,cy-i,4,i*2+1);
    ctx.globalAlpha=1;
  }
  for(const e of events){if(e.k!=='boat')continue;
    ctx.fillStyle='#06203a'; ctx.globalAlpha=0.16; ctx.fillRect(Math.round(e.x)+1,SKY+1,18,5); ctx.globalAlpha=1;}
}
function drawSky(t,dk){
  const raining=rainT>0;
  let top=hexMix('#8fd6ff','#0d1030',dk),bot=hexMix('#d8f3ff','#2a2e66',dk);
  const p=dayPhase();
  if(p>=590&&p<700){const u=1-Math.abs((p-640)/50); top=hexMix(top,'#ff9a7a',u*0.6); bot=hexMix(bot,'#ffd08a',u*0.6);}
  if(raining){top=hexMix(top,'#7a8494',0.5); bot=hexMix(bot,'#a9b3c2',0.5);}
  for(let y=0;y<SKY;y++){ctx.fillStyle=hexMix(top,bot,y/SKY); ctx.fillRect(0,y,W,1);}
  if(dk>0.2) for(const s of stars){ctx.globalAlpha=dk*(0.5+0.5*Math.sin(t*2+s.p)); ctx.fillStyle='#fff8d0'; ctx.fillRect(s.x,s.y,1,1);}
  ctx.globalAlpha=1;
  if(!raining){
    if(p<620){const sx=Math.round(p/620*(W+10))-5; ctx.fillStyle='#ffe680'; ctx.globalAlpha=1-dk; ctx.fillRect(sx,2,4,4); ctx.fillRect(sx-1,3,6,2); ctx.fillRect(sx+1,1,2,6);}
    if(p>=640&&p<920){const mx=Math.round((p-640)/280*(W+10))-5; ctx.globalAlpha=dk; ctx.fillStyle='#f4f1d0'; ctx.fillRect(mx,2,4,4); ctx.fillStyle=top; ctx.fillRect(mx+2,2,2,2);}
    ctx.globalAlpha=1;
  }
  for(const e of events){
    if(e.k==='meteor'){for(let i=0;i<7;i++){ctx.globalAlpha=Math.min(1,e.life*1.5)*(1-i/7); ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(e.x+i*2),Math.round(e.y-i*0.5),1,1);} ctx.globalAlpha=1;}
    if(e.k==='boat'){drawRows(ctx,BOAT,BOAT.frames.A,Math.round(e.x),SKY-5,e.dir<0,t);
      if(dk>0.4){ctx.fillStyle='#fff3a0'; ctx.globalAlpha=0.5*dk; ctx.fillRect(Math.round(e.x)+7,SKY-3,7,2); ctx.globalAlpha=1;}}
    if(e.k==='ducks') for(let i=0;i<3;i++){const bx=Math.round(e.x+i*9*-e.dir),by=SKY-3+Math.round(Math.sin(t*2+i)*0.6); drawRows(ctx,DUCK,DUCK.frames.A,bx,by,e.dir<0,t);}
    if(e.k==='ufo'){
      if(e.ph==='beam'||e.ph==='drop'){ctx.fillStyle='#fff6a0'; ctx.globalAlpha=0.25+0.1*Math.sin(t*10);
        const bx=Math.round(e.x); for(let y=Math.round(e.y)+5;y<SANDY;y++){const hw=2+Math.floor((y-e.y)/6); ctx.fillRect(bx+5-hw,y,hw*2+1,1);} ctx.globalAlpha=1;}
      drawRows(ctx,UFO,UFO.frames.A,Math.round(e.x),Math.round(e.y),false,t);
      if(Math.floor(t*6)%2){ctx.fillStyle='#ff5af0'; ctx.fillRect(Math.round(e.x)+5,Math.round(e.y)-1,1,1);}
    }
  }
  ctx.fillStyle='#cfefff';
  for(const r of rain) ctx.fillRect(Math.round(r.x),Math.round(r.y),1,2);
  ctx.fillStyle=hexMix('#e8fbff','#5a6aa0',dk);
  for(let x=0;x<W;x++) if((x+Math.floor(t*4))%7<4) ctx.fillRect(x,SKY,1,1);
}

/* ---------------- 메인 루프 ---------------- */
let last=performance.now(),hudT=0,saveT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000, dk=darkness();
  for(const f of [...fishes]) if(fishes.includes(f)) updateFish(f,dt,t);
  for(const k of coins) if(k.y<k.restY) k.y=Math.min(k.restY,k.y+k.vy*dt);
  coins=coins.filter(k=>!k.dead);
  for(const p of pellets){ if(p.y<SANDY+1){p.y+=p.vy*dt; p.x+=Math.sin(t*3+p.ph)*0.08;} else p.life-=dt; }
  pellets=pellets.filter(p=>p.life>0);
  for(const b of bubbles){b.y+=b.vy*dt; b.x+=Math.sin(t*4+b.ph)*0.12;}
  bubbles=bubbles.filter(b=>b.y>SKY);
  if(Math.random()<dt*0.9){const wd=pick(weeds); if(wd) bubbles.push({x:wd.x,y:SANDY,r:Math.random()<.6?1:2,vy:-rand(9,15),ph:Math.random()*6});}
  for(const p of parts){p.life-=dt; if(p.k==='heart')p.y-=8*dt; if(p.k==='drop'){p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt;}}
  parts=parts.filter(p=>p.life>0);
  updateEvents(dt);

  // --- 물속 ---
  ctx.drawImage(bg,0,0);
  drawWhales();
  if(dk<1){
    ctx.fillStyle='#ffffff';
    for(let i=0;i<4;i++){
      ctx.globalAlpha=(0.05+0.03*Math.sin(t*0.7+i*1.7))*(1-dk)*(rainT>0?0.4:1);
      const bx=((i*W/3.3+t*2.5)%(W+60))-40,wid=5+(i%2)*4;
      for(let y=SKY;y<SANDY;y++) ctx.fillRect(Math.round(bx+(y-SKY)*0.35),y,wid,1);
    }
    ctx.globalAlpha=1;
  }
  for(const wd of weeds) for(let i=0;i<wd.h;i++){
    const off=Math.round(Math.sin(t*1.4+wd.ph+i*0.3)*(i/wd.h)*2.5);
    ctx.fillStyle=(Math.floor(i/3)%2)?wd.c1:wd.c2; ctx.fillRect(wd.x+off,SANDY+2-i,2,1);
  }
  if(chestVisible()){
    drawRows(ctx,CHEST,CHEST.frames.A,CHX,CHY,false,t);
    if(game.stash>0&&Math.floor(t*2)%2){ctx.fillStyle='#fff7b0';ctx.fillRect(CHX+8,CHY-2,1,1);ctx.fillRect(CHX+2,CHY-1,1,1);}
  }
  for(const k of coins){
    drawRows(ctx,COIN,COIN.frames.A,Math.round(k.x),Math.round(k.y),false,t);
    if(Math.floor(t*1.5+k.x)%4===0){ctx.fillStyle='#ffffff';ctx.fillRect(Math.round(k.x)+1,Math.round(k.y)+1,1,1);}
  }
  ctx.fillStyle='#b86b2e';
  for(const p of pellets) ctx.fillRect(Math.round(p.x),Math.round(p.y),2,1);
  for(const f of fishes) if(!f.drop&&!f.held) drawFish(f,t);
  ctx.fillStyle='#e0f8ff';
  for(const b of bubbles){
    const x=Math.round(b.x),y=Math.round(b.y);
    if(b.r===1) ctx.fillRect(x,y,1,1);
    else{ctx.fillRect(x,y-1,1,1);ctx.fillRect(x-1,y,1,1);ctx.fillRect(x+1,y,1,1);ctx.fillRect(x,y+1,1,1);}
  }
  // 밤 어둠 + 빛나는 친구들
  if(dk>0){ctx.fillStyle='#0a1030'; ctx.globalAlpha=0.55*dk; ctx.fillRect(0,SKY,W,H-SKY); ctx.globalAlpha=1;}
  if(rainT>0){ctx.fillStyle='#3a4660'; ctx.globalAlpha=0.12; ctx.fillRect(0,SKY,W,H-SKY); ctx.globalAlpha=1;}
  for(const f of fishes) if(!f.drop&&!f.gone) drawGlow(f,t,dk);
  for(const p of parts){
    if(p.k==='heart'){ctx.globalAlpha=Math.min(1,p.life*1.5); drawRows(ctx,HEART,HEART.frames.A,Math.round(p.x),Math.round(p.y),false,t);}
    else if(p.k==='spark'){ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle='#fff7b0';
      const x=Math.round(p.x),y=Math.round(p.y); ctx.fillRect(x,y,1,1);
      if(p.life>0.35){ctx.fillRect(x-1,y,1,1);ctx.fillRect(x+1,y,1,1);ctx.fillRect(x,y-1,1,1);ctx.fillRect(x,y+1,1,1);}}
  }
  ctx.globalAlpha=1;
  // 끌고 있는 물고기 + 합칠 수 있는 짝 표시
  if(drag&&drag.moved&&fishes.includes(drag.f)){
    const g=drag.f;
    if(Math.floor(t*4)%2) for(const o of fishes) if(o!==g&&o.id===g.id&&alive(o)){
      const ax=Math.round(o.x+o.w/2),ay=Math.round(o.y)-5;
      ctx.fillStyle='#ffe14a'; ctx.fillRect(ax-2,ay,5,1); ctx.fillRect(ax-1,ay+1,3,1); ctx.fillRect(ax,ay+2,1,1);
    }
    ctx.fillStyle='#000'; ctx.globalAlpha=0.2; ctx.fillRect(Math.round(g.x)+2,Math.round(g.y+g.h)+2,g.w-4,2); ctx.globalAlpha=1;
    drawFish(g,t);
  }
  // --- 하늘 ---
  drawSky(t,dk);
  for(const f of fishes) if(f.drop) drawFish(f,t);
  for(const p of parts){
    if(p.k==='drop'){ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle='#e8fbff'; ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1);}
    if(p.k==='ripple'){ctx.globalAlpha=p.life*3; ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(p.x)-1,SKY,3,1);}
  }
  ctx.globalAlpha=1;

  hudT-=dt; if(hudT<=0){hudT=0.25; tickArrival(); updateHud();}
  saveT-=dt; if(saveT<=0){saveT=5; save();}
  requestAnimationFrame(frame);
}
const chestVisible=()=>game.stash>0||fishes.some(f=>f.sp.thief);

/* ---------------- 터치 ---------------- */
let lastTap={f:null,t:0},drag=null;
function tapFish(f){
  const c=center(f),now=performance.now();
  if(lastTap.f===f&&now-lastTap.t<450){lastTap.f=null; openRename(f); return;}
  lastTap={f,t:now};
  if(f.sp.thief&&f.carry){
    spawnCoin(c.x-2,c.y,f.carry); f.carry=0; f.state='wander'; f.cool=12;
    popText(c.x,f.y,'앗!','pink'); return;
  }
  parts.push({k:'heart',x:c.x-2,y:f.y-4,life:1.2});
  if(f.id==='heart') parts.push({k:'heart',x:c.x+3,y:f.y-7,life:1.2});
  const say=f.sp.piggy?'짤랑짤랑':f.sp.arcade?'삐빅':f.sp.bull?'음머':f.id==='alien'?'뀨?':'';
  popText(c.x,f.y-4,(f.name||f.sp.name)+(say?' · '+say:''));
  if(!game.tips.name){game.tips.name=1; setTimeout(()=>toast('물고기를 톡톡 두 번 누르면 이름을 지어 줄 수 있어요'),900);}
}
cv.addEventListener('pointermove',e=>{
  if(!drag) return;
  const lx=e.clientX/Z,ly=e.clientY/Z,f=drag.f;
  if(!drag.moved&&Math.hypot(lx-drag.sx,ly-drag.sy)>3){
    drag.moved=true; f.held=true; f.vx=0; f.vy=0;
    if(f.link){f.link.link=null; f.link.lead=false; f.link=null; f.lead=false;}
    if(f.carry){spawnCoin(center(f).x-2,center(f).y,f.carry); f.carry=0; f.state='wander'; f.cool=12;}
  }
  if(drag.moved){f.x=clamp(lx-drag.ox,0,W-f.w); f.y=clamp(ly-drag.oy,SKY+3,SANDY-f.h-1);}
});
function endDrag(){
  if(!drag) return;
  const f=drag.f,moved=drag.moved; drag=null;
  if(!fishes.includes(f)) return;
  if(!moved){tapFish(f); return;}
  f.held=false; pickWander(f);
  const c=center(f);
  let best=null,bd=1e9;
  for(const o of fishes) if(o!==f&&o.id===f.id&&alive(o)){const d=dist(center(o),c); if(d<bd){bd=d;best=o;}}
  if(best&&bd<(f.w+best.w)/2.5) mergeFish(f,best);
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerdown',e=>{
  const lx=e.clientX/Z,ly=e.clientY/Z;
  for(const k of coins) if(!k.dead&&Math.hypot(k.x+2.5-lx,k.y+2.5-ly)<6){
    k.dead=true; game.coins+=k.v; popText(k.x+2.5,k.y,'+'+k.v,'gold'); save(); updateHud(); return;
  }
  if(chestVisible()&&lx>=CHX-2&&lx<=CHX+13&&ly>=CHY-3&&ly<=CHY+10){
    if(game.stash>0){
      popText(CHX+5,CHY-2,'도둑 금고 털기! +'+game.stash,'gold');
      game.coins+=game.stash; game.stash=0; save(); updateHud();
      const th=fishes.find(f=>f.sp.thief&&alive(f)); if(th) popText(center(th).x,th.y,'헉!','pink');
    } else toast('도둑 물고기의 비밀 금고예요. 아직 텅 비었어요.');
    return;
  }
  for(let i=fishes.length-1;i>=0;i--){const f=fishes[i];
    if(f.drop||f.gone) continue;
    if(lx>=f.x-2&&lx<=f.x+f.w+2&&ly>=f.y-2&&ly<=f.y+f.h+2){
      drag={f,sx:lx,sy:ly,ox:lx-f.x,oy:ly-f.y,moved:false};
      try{cv.setPointerCapture(e.pointerId);}catch(err){}
      return;
    }
  }
  if(ly>SKY&&ly<SANDY) feed(lx,ly);
});

/* ---------------- UI ---------------- */
let toastQ=[],toastBusy=false;
function toast(msg,ms=2300){toastQ.push([msg,ms]); if(!toastBusy) nextToast();}
function nextToast(){
  const n=toastQ.shift(),el=$('toast');
  if(!n){toastBusy=false;return;}
  toastBusy=true; el.textContent=n[0]; el.classList.add('show');
  setTimeout(()=>{el.classList.remove('show'); setTimeout(nextToast,320);},n[1]);
}
function popText(lx,ly,txt,cls=''){
  const d=document.createElement('div'); d.className='pop '+cls; d.textContent=txt;
  d.style.left=clamp(lx*Z,40,innerWidth-40)+'px'; d.style.top=Math.max(30,ly*Z)+'px'; document.body.appendChild(d);
  setTimeout(()=>d.remove(),1150);
}
$('coinIco').appendChild(spriteCanvas(COIN,3));
$('fishIco').appendChild(spriteCanvas(SP.gold,1.5));
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function updateHud(){
  $('coinTxt').textContent=game.coins;
  $('tankTxt').textContent=fishes.length+'/'+MAX_TANK;
  const full=fishes.length>=MAX_TANK;
  const pct=full?100:clamp(100-(game.nextAt-Date.now())/(game.nextLen*1000)*100,0,100);
  $('gfill').style.width=pct+'%';
  $('sumBtn').disabled=game.coins<SUMMON_COST||full;
}
$('gaugeChip').onclick=()=>{
  if(fishes.length>=MAX_TANK) toast('어항이 꽉 찼어요. 새 친구는 잠시 쉬어요.');
  else toast('다음 친구까지 '+fmt((game.nextAt-Date.now())/1000));
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m&&m.id!=='revealModal')m.classList.remove('open');}));

/* ---------- 이름 짓기 ---------- */
let renaming=null;
function openRename(f){
  renaming=f;
  $('nameWho').innerHTML=`<span class="r${f.sp.rar}">${f.sp.name}</span>의 이름을 지어 주세요.`;
  $('nameInput').value=f.name||'';
  $('nameModal').classList.add('open');
  setTimeout(()=>$('nameInput').focus(),50);
}
$('nameOk').onclick=()=>{
  if(renaming&&fishes.includes(renaming)){
    renaming.name=$('nameInput').value.trim().slice(0,8);
    if(renaming.name){unlock('name'); const c=center(renaming); popText(c.x,renaming.y,'안녕, '+renaming.name+'!','pink');}
    save();
  }
  $('nameModal').classList.remove('open');
};
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('nameOk').click();});

/* ---------- 부르기 · 합치기 ---------- */
const SUMMON_COST=15;
$('sumBtn').onclick=()=>{
  if(fishes.length>=MAX_TANK){toast('어항이 꽉 찼어요. 같은 물고기끼리 합쳐 보세요!');return;}
  if(game.coins<SUMMON_COST){toast('코인이 '+SUMMON_COST+'개 필요해요');return;}
  game.coins-=SUMMON_COST; arrive();
  game.nextLen=arriveLen(fishes.length); game.nextAt=Date.now()+game.nextLen*1000;
  save(); updateHud();
};
function mergeFish(a,b){
  const rar=a.sp.rar;
  if(rar>=3){toast('전설끼리는 합칠 수 없어요. 둘이 사이좋게 지내요 ✨');return;}
  const c=center(b);
  for(const o of [a,b]){
    if(o.carry){spawnCoin(center(o).x-2,center(o).y,o.carry);}
    if(o.link){o.link.link=null; o.link.lead=false;}
    fishes.splice(fishes.indexOf(o),1);
  }
  const sp=pick(SPECIES.filter(s=>s.rar===rar+1&&!s.secret&&!s.hidden));
  const isNew=!game.owned[sp.id];
  game.owned[sp.id]=(game.owned[sp.id]||0)+1;
  const f=makeFish(sp.id,{});
  f.x=clamp(c.x-f.w/2,0,W-f.w); f.y=clamp(c.y-f.h/2,SKY+3,SANDY-f.h-1);
  fishes.push(f);
  for(let i=0;i<12;i++) parts.push({k:'spark',x:c.x+rand(-8,8),y:c.y+rand(-6,6),life:0.6+Math.random()*0.5});
  parts.push({k:'heart',x:c.x-2,y:c.y-10,life:1.2});
  popText(c.x,c.y-6,'뿅!','gold');
  unlock('merge'); if(sp.rar===2) unlock('epic');
  checkCounts(); save(); updateHud();
  if(sp.rar>=2) showReveal(sp,isNew);
  else toast(`${RAR[sp.rar]} ${sp.name} 탄생!${isNew?' NEW ✨':''}`);
}
function showReveal(sp,isNew){
  const m=$('revealModal'),body=$('revealBody');
  body.innerHTML=`<div class="stage shake st0" id="stage"></div><p>두근두근… 뭐가 나올까?</p>`;
  $('stage').appendChild(spriteCanvas(sp,8,true));
  m.classList.add('open');
  setTimeout(()=>{
    body.innerHTML=`<div class="stage st${sp.rar}" id="stage"></div>
      <div class="r${sp.rar}">★ ${RAR[sp.rar]} ★</div>
      <h3>${sp.name} ${isNew?'<span class="new">NEW!</span>':''}</h3>
      <p>${sp.desc}</p>
      <button class="btn primary" id="rvOk">좋아!</button>`;
    $('stage').appendChild(spriteCanvas(sp,8,false));
    $('rvOk').onclick=()=>m.classList.remove('open');
  },1100);
}

/* ---------- 도감 ---------- */
function renderDex(){
  const got=DEX.filter(s=>game.owned[s.id]).length;
  $('dexCount').textContent=` ${got}/${DEX.length}`;
  const grid=$('dexGrid'); grid.innerHTML='';
  for(const s of DEX){
    const has=!!game.owned[s.id],card=document.createElement('div');
    card.className='card';
    const pic=document.createElement('div'); pic.className='pic'; pic.appendChild(spriteCanvas(s,3,!has)); card.appendChild(pic);
    card.insertAdjacentHTML('beforeend',`<div>${has?s.name:'???'}</div><div class="r${s.rar}">${RAR[s.rar]}${has?' ×'+game.owned[s.id]:''}</div>`);
    card.onclick=()=>{
      grid.querySelectorAll('.card').forEach(c=>c.classList.remove('sel')); card.classList.add('sel');
      const where=s.secret?(s.hint||'비밀 조건으로 만날 수 있어요.'):s.rar===0?'게이지가 차면 찾아와요.':
        s.rar===1?'게이지가 차면 가끔 찾아와요. 같은 일반 물고기 2마리를 합쳐도 나와요.':
        `같은 ${RAR[s.rar-1]} 물고기 2마리를 합치면 나올 수 있어요.`;
      $('dexInfo').innerHTML=has?`<b class="r${s.rar}">${s.name}</b> · ${RAR[s.rar]}<br>${s.desc}`
        :`<b>???</b> · <span class="r${s.rar}">${RAR[s.rar]}</span><br>아직 못 만났어요. ${where}`;
    };
    grid.appendChild(card);
  }
  $('dexInfo').textContent='물고기를 눌러 보세요.';
}
$('dexBtn').onclick=()=>{renderDex(); $('dexModal').classList.add('open');};

/* ---------- 도전 과제 ---------- */
const ACH=[
  ['three','셋이면 친구','물고기 3마리가 함께 있기'],
  ['ten','북적북적','어항에 물고기 10마리'],
  ['full','만석입니다','어항을 가득 채우기'],
  ['merge','뿅!','처음으로 물고기 합치기'],
  ['epic','반짝반짝','합쳐서 에픽 물고기 만들기'],
  ['name','이름을 불러 줘','물고기에게 이름 지어 주기'],
  ['rain','비 오는 날','바다에 비가 내리는 걸 보기'],
  ['star','소원을 빌어 봐','밤하늘의 별똥별 보기'],
  ['steal','범인은 이 안에','도둑 물고기가 동전을 훔쳤다'],
  ['jackpot','잭팟!','오락기 물고기에서 잭팟 터뜨리기'],
  ['bull','쾅!','투우 물고기가 빨강이를 들이받았다'],
  ['magnet','자석 같은 느낌','N극과 S극이 하나가 되었다'],
  ['slime','왕 젤리 프로젝트','젤리 셋을 하나로 합치기'],
  ['ufo','유괴','하늘에서 무언가가 찾아왔다'],
  ['legend','전설을 만나다','전설 물고기 만나기'],
  ['all','그게 다란다, 물고기들아!','도감 완성하기']
];
function unlock(id){
  if(game.ach[id]) return;
  game.ach[id]=Date.now();
  const a=ACH.find(x=>x[0]===id); if(a) toast('🏆 도전 과제: '+a[1]);
  save();
}
function checkCounts(){
  const n=fishes.length;
  if(n>=3) unlock('three'); if(n>=10) unlock('ten'); if(n>=MAX_TANK) unlock('full');
  if(SPECIES.some(s=>s.rar===3&&game.owned[s.id])) unlock('legend');
  if(DEX.every(s=>game.owned[s.id])) unlock('all');
  if(!game.tips.merge){
    const ids=fishes.filter(f=>!f.gone).map(f=>f.id);
    if(ids.some((id,i)=>ids.indexOf(id)!==i)){game.tips.merge=1; toast('같은 물고기가 둘! 끌어다 겹쳐 보세요 👆');}
  }
}
function renderAch(){
  const got=ACH.filter(a=>game.ach[a[0]]).length;
  $('achCount').textContent=` ${got}/${ACH.length}`;
  $('achList').innerHTML=ACH.map(([id,n,d])=>{
    const on=!!game.ach[id];
    return `<div class="ach ${on?'':'off'}">${on?'🏆':'🔒'} <b>${n}</b><br>${on||id!=='ufo'?d:'???'}</div>`;
  }).join('');
}
$('achBtn').onclick=()=>{renderAch(); $('achModal').classList.add('open');};

/* ---------------- 시작 ---------------- */
addEventListener('resize',resize);
resize();
fishes=game.tank.filter(o=>SP[(o.id||o)]).map(o=>makeFish(o.id||o,{name:o.name}));
checkCounts(); updateHud();
requestAnimationFrame(frame);
if(!game.tips.start){
  game.tips.start=1;
  setTimeout(()=>toast('물을 톡 치면 먹이가 떨어져요 🍤',2600),700);
  setTimeout(()=>toast('오른쪽 위 게이지가 차면 새 친구가 와요',2600),100);
  setTimeout(()=>toast('같은 물고기를 끌어다 겹치면 합쳐져요!',2600),200);
  save();
}
</script>
